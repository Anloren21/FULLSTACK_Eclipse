<!doctype html>
<html lang="es" class="h-100">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ipartube</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
	crossorigin="anonymous">
<script type="module"
	src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
	crossorigin="anonymous"></script>
<script type="module" src="js/index.js"></script>
</head>
<body class="h-100 d-flex flex-column">
	<nav class="navbar md:navbar-expand bg-1">
		<div class="container-fluid">
			<a class="navbar-brand" href="javascript:listado()">Ipartube</a>
			<button class="btn-icon navbar-toggler" type="button"
				data-bs-toggle="drawer" data-bs-target="#navbarDrawer"
				aria-controls="navbarDrawer" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon" aria-hidden="true"></span>
			</button>
			<div class="drawer-body mb-2 md:mb-0">
				<ul class="nav navbar-nav me-auto mb-2 mb-lg-0">
					<li class="nav-item"><a class="nav-link"
						href="javascript:listado()">Principal</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<main class="container my-5 flex-grow-1">
		<section id="listado">
			<h2>Listado de Videos</h2>
			<div id="listado-videos" class="row row-cols-1 md:row-cols-3 g-4">

			</div>

		</section>

		<section id="detalle">
			<div class="card  offset-lg-2 col-lg-8">
				<div class="w-100 ratio-16x9 card-img">
					<iframe class="w-100 ratio-16x9" src="" title="" allowfullscreen></iframe>
				</div>
				<div class="card-body">
					<h5 class="card-title">
						<a href="javascript:"></a>
					</h5>
					<p class="card-text"></p>
				</div>
				<div class="card-footer">
					<small class="text-body-secondary"></small>
				</div>
			</div>

			<form
				class="list-group-item d-flex justify-content-between align-items-start py-4 mt-4">
				<div class="ms-2 w-100">
					<div class="d-flex">
						<div class="fw-bold me-auto">
							Angie
						</div>
						<span class="badge theme-primary rounded-pill aligns-selfs-baseline">
						<script>document.write(new Date().toISOString())</script></span>
					</div>
					<textarea name="comentario-texto" class="form-control col"></textarea>
					<button class="btn-solid theme-primary">Enviar comentario</button>
				</div>
			</form>

			<ul class="mt-4 list-group">

			</ul>
		</section>

	</main>

	<footer class="text-bg-dark p-2">
		<p>&copy; 2026 Rjhu Lorraine</p>
	</footer>
</body>
</html>
